border-color:rgba(255,255,255,.05)">• ${E(x.time)} — ${E(x.action)}</div>`).join("")||"<p class=muted style='text-align:center;margin:20px 0'>گزارشی وجود ندارد.</p>"}</div>`}function SP(){return `<div class="ph"><div><h2>تنظیمات</h2><div class="sb">کنترل وضعیت سایت و پشتیبان‌گیری</div></div></div><div class="fm"><label class="se2"><div><strong>قفل اضطراری سایت</strong><div class="sb" style="margin-top:4px">با فعال‌سازی، کاربران به محتوا دسترسی نخواهند داشت.</div></div><input type="checkbox" ${db.maintenance?"checked":""} onchange="db.maintenance=this.checked;S();DA()"></label><div style="display:flex;gap:10px;margin-top:10px"><button class="btn" onclick="ED()">خروجی پشتیبان JSON</button><button class="btn d" onclick="RD()">بازنشانی اطلاعات نمونه</button></div><div class="no" style="margin-top:20px">این نسخه استاتیک است. برای امنیت واقعی از سرور استفاده کن.</div></div>`}function ED(){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:"application/json"}));a.download="videohub-backup.json";a.click()}function RD(){if(confirm("همه داده‌های محلی پاک شود؟")){localStorage.removeItem(K);db=L();DA()}}RE();</script></body></html>
